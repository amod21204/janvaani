<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JanVaani Multilingual Complaint Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 text-slate-900">
    <main class="mx-auto max-w-5xl px-4 py-10">
      <section class="rounded-3xl border border-slate-200 bg-white shadow-sm">
        <div class="border-b border-slate-200 px-6 py-5">
          <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">JanVaani</p>
          <h1 class="mt-2 text-3xl font-bold">Multilingual Complaint Translator</h1>
          <p class="mt-2 text-sm text-slate-600">
            Enter complaints in English, Hindi, or Punjabi. JanVaani will translate and formalize them into English legal language.
          </p>
        </div>

        <div class="grid gap-6 px-6 py-6 lg:grid-cols-[1fr,1fr]">
          <div class="space-y-5">
            <label class="block">
              <span class="mb-2 block text-sm font-semibold text-slate-700">Language</span>
              <select id="language" class="w-full rounded-2xl border border-slate-300 bg-slate-50 px-4 py-3 outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="pa">Punjabi</option>
              </select>
            </label>

            <label class="block">
              <span class="mb-2 block text-sm font-semibold text-slate-700">Complaint Input</span>
              <textarea
                id="complaintText"
                rows="10"
                class="w-full rounded-2xl border border-slate-300 bg-slate-50 px-4 py-3 outline-none focus:border-orange-500 focus:ring-4 focus:ring-orange-500/10"
                placeholder="Type your complaint here..."
              ></textarea>
            </label>

            <div class="flex flex-col gap-3 sm:flex-row">
              <button id="generateButton" class="rounded-2xl bg-orange-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-orange-700">
                Generate Complaint
              </button>
              <button id="downloadButton" class="rounded-2xl border border-slate-300 px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-50" disabled>
                Download as PDF
              </button>
            </div>

            <div id="loading" class="hidden items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">
              <span class="h-4 w-4 animate-spin rounded-full border-2 border-orange-500 border-t-transparent"></span>
              Processing complaint...
            </div>

            <div id="errorBox" class="hidden rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>
          </div>

          <div class="space-y-5">
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <h2 class="text-sm font-semibold uppercase tracking-[0.16em] text-slate-500">Original Text</h2>
              <textarea id="originalOutput" rows="5" readonly class="mt-3 w-full resize-none rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm"></textarea>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <h2 class="text-sm font-semibold uppercase tracking-[0.16em] text-slate-500">Translated Complaint</h2>
              <textarea id="translatedOutput" rows="5" readonly class="mt-3 w-full resize-none rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm"></textarea>
            </div>

            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <h2 class="text-sm font-semibold uppercase tracking-[0.16em] text-slate-500">Formal Legal Complaint</h2>
              <div id="formattedOutput" class="mt-3 min-h-[220px] rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm leading-relaxed whitespace-pre-wrap"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/translate.js"></script>
  </body>
</html>
