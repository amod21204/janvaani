services:
  backend:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    environment:
      PORT: 5000
      HOST: 0.0.0.0
      FRONTEND_ORIGIN: https://your-vercel-app.vercel.app
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root1234
      DB_NAME: janvaani

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: janvaani
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
